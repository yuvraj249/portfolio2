name: Trigger Vercel Portfolio Revalidation

on:
  push:
    branches:
      - main
      - master

jobs:
  revalidate-portfolio:
    name: Revalidate Live GitHub Data
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy / ISR Hook
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            echo "Successfully triggered Vercel deploy hook for instant portfolio update."
          else
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set. Skipping deploy hook."
          fi
